name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - production-hardening
      - "hardening/**"

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate production-hardening issue register
        run: npm run validate:hardening-register

      - name: Run root lint
        run: npm run lint

      - name: Run mobile lint
        working-directory: mobile
        run: npm run lint

      - name: Run root typecheck
        run: npm run typecheck

      - name: Run mobile typecheck
        working-directory: mobile
        run: npm run typecheck

  root-tests:
    name: Full root tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full root tests
        run: npm test

  memory-tests:
    name: Memory security and hardening tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Memory security and hardening tests
        run: npm run test:memory-hardening

  database-contract:
    name: Canonical Supabase contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Validate canonical migration manifest
        run: npm run db:manifest

      - name: Start pinned local Supabase
        run: npm run db:start

      - name: Prove two consecutive clean canonical resets
        run: npm run db:reset && npm run db:reset

      - name: Lint canonical database SQL
        run: npm run db:lint

      - name: Run schema, RLS, Storage, and grant contracts
        run: npm run db:test

      - name: Run supported upgrade fixtures
        run: npm run db:test:upgrades

      - name: Audit local drift through the read-only contract
        run: npm run db:drift-report

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  web-build:
    name: Next production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          MEMORY_UPLOAD_CLEANUP_SECRET: ci-placeholder-cleanup-secret
          MEDIA_WORKER_SECRET: ci-placeholder-media-worker-secret

  mobile-export:
    name: Expo Android production export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/circlebites-expo-export --clear
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid

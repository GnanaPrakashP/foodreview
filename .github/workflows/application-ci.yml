name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - production-hardening
      - "hardening/**"

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate production-hardening issue register
        run: npm run validate:hardening-register

      - name: Validate observability, schedules, alerts and runbooks
        run: npm run validate:observability

      - name: Validate native release, store and smoke inventories
        run: npm run validate:native-release

      - name: Validate Phase 9 load and capacity harness
        run: npm run validate:load-capacity && npm run test:load-capacity && npm run load:ci-smoke

      - name: Run Phase 8 native release contracts
        run: npm run test:native-release

      - name: Validate mobile API trust-boundary inventory
        run: npm run validate:mobile-api-security

      - name: Run Phase 4 static security contracts
        run: npm run test:mobile-api-security

      - name: Validate Phase 5 backend performance budgets
        run: npm run validate:backend-performance

      - name: Run Phase 5 static performance contracts
        run: npm run test:backend-performance

      - name: Run Phase 7 observability, alert and push contracts
        run: npm run test:observability-operations

      - name: Run root lint
        run: npm run lint

      - name: Run mobile lint
        working-directory: mobile
        run: npm run lint

      - name: Run root typecheck
        run: npm run typecheck

      - name: Run mobile typecheck
        working-directory: mobile
        run: npm run typecheck

  root-tests:
    name: Full root tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full root tests
        run: npm test

  memory-tests:
    name: Memory security and hardening tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Memory security and hardening tests
        run: npm run test:memory-hardening

  database-contract:
    name: Canonical Supabase contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Validate canonical migration manifest
        run: npm run db:manifest

      - name: Start pinned local Supabase
        run: npm run db:start

      - name: Prove two consecutive clean canonical resets
        run: npm run db:reset && npm run db:reset

      - name: Lint canonical database SQL
        run: npm run db:lint

      - name: Run schema, RLS, Storage, and grant contracts
        run: npm run db:test

      - name: Run Phase 4 database security behaviors
        run: npm run validate:mobile-api-security:db

      - name: Run Phase 5 database plans and cursor behaviors
        run: npm run validate:backend-performance:db

      - name: Run Phase 5 production API timing and payload matrix
        run: npm run validate:backend-performance:api

      - name: Run Phase 7 database health and missed-scheduler behaviors
        run: npm run validate:observability:db

      - name: Validate deterministic Phase 9 seed and cleanup against the canonical schema
        run: npm run validate:load-seed:db

      - name: Run Phase 4 API and local recovery behaviors
        run: npm run validate:mobile-api-security:api

      - name: Report sanitized API-security runtime health
        run: npm run report:mobile-api-security:runtime

      - name: Run supported upgrade fixtures
        run: npm run db:test:upgrades

      - name: Audit local drift through the read-only contract
        run: npm run db:drift-report

      - name: Prove a real local backup restore and restored contracts
        run: npm run backup:restore-drill:local

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  web-build:
    name: Next production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          MEMORY_UPLOAD_CLEANUP_SECRET: ci-placeholder-cleanup-secret
          MEDIA_WORKER_SECRET: ci-placeholder-media-worker-secret
          API_RATE_LIMIT_HMAC_SECRET: ci-placeholder-rate-limit-hmac-material-0123456789
          API_TRUSTED_PROXY_HOPS: "1"
          MOBILE_AUTH_REDIRECT_BASE: circlebites://
          MODERATION_OPERATOR_SECRET: ci-placeholder-moderation-operator-material-0123456789

  mobile-export:
    name: Expo Android production export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/circlebites-expo-export-android --clear
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/circlebites-expo-export-ios --clear
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid

      - name: Scan mobile exports for forbidden server-only configuration names
        run: |
          if rg -n 'EXPO_PUBLIC_SUPABASE_SERVICE|SUPABASE_SERVICE_ROLE_KEY|API_RATE_LIMIT_HMAC_SECRET|MODERATION_OPERATOR_SECRET|MEDIA_WORKER_SECRET|ACCOUNT_DELETION_WORKER_SECRET' /tmp/circlebites-expo-export-android /tmp/circlebites-expo-export-ios; then
            echo 'Forbidden server-only configuration name found in mobile export' >&2
            exit 1
          fi

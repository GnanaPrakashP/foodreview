name: Native release candidate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE_CANDIDATE to run signed build gates; this workflow never submits to a store"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Explicit release approval and inventory
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - name: Require explicit confirmation
        run: test "${{ inputs.confirmation }}" = "RELEASE_CANDIDATE"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install root and mobile dependencies
        run: npm ci && npm --prefix mobile ci
      - name: Validate release and issue inventories
        run: npm run validate:hardening-register && npm run validate:native-release
      - name: Require external release credentials without printing them
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          for name in ANDROID_KEYSTORE ANDROID_ALIAS ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD APPLE_TEAM_ID EXPO_TOKEN SENTRY_AUTH_TOKEN; do
            if test -z "${!name}"; then
              echo "Missing required production-release credential: $name" >&2
              exit 1
            fi
          done

  application-and-database:
    name: Application, database and prior-phase gates
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci && npm --prefix mobile ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Static, type and focused release gates
        run: npm run lint && npm --prefix mobile run lint && npm run typecheck && npm --prefix mobile run typecheck && npm run test:native-release
      - name: Production dependency advisory gates
        run: npm audit --omit=dev --audit-level=high && npm --prefix mobile audit --omit=dev --audit-level=high
      - name: Phase 1A-7 and full suite gates
        run: npm run test:memory-hardening && npm run test:mobile-api-security && npm run test:backend-performance && npm run test:mobile-performance && npm run test:observability-operations && npm test
      - name: Canonical database gates
        run: npm run db:start && npm run db:verify && npm run validate:post-media-phase1a && npm run validate:account-deletion-phase1b && npm run validate:media-worker-phase2 && npm run validate:media-worker-phase2:processing && npm run validate:mobile-api-security:db && npm run validate:backend-performance:db && npm run validate:observability:db
      - name: Stop database
        if: always()
        run: npm run db:stop
      - name: Next production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          API_RATE_LIMIT_HMAC_SECRET: ${{ secrets.PRODUCTION_API_RATE_LIMIT_HMAC_SECRET }}
          APP_ENVIRONMENT: production
          APP_RELEASE: ${{ github.sha }}
          SENTRY_DSN: ${{ secrets.PRODUCTION_SENTRY_DSN }}

  android-release:
    name: Signed Android APK and AAB
    needs: [preflight, application-and-database]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Materialize production upload key outside the repository
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/circlebites-upload.jks"
      - name: Build signed production APK and AAB
        env:
          CIRCLEBITES_RELEASE_STORE_FILE: ${{ runner.temp }}/circlebites-upload.jks
          CIRCLEBITES_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          CIRCLEBITES_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          CIRCLEBITES_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          EXPO_PUBLIC_APP_ENVIRONMENT: production
          EXPO_PUBLIC_RELEASE_CHANNEL: production
          EXPO_PUBLIC_RELEASE_ID: ${{ github.sha }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          EXPO_PUBLIC_WEB_BASE_URL: https://www.circlebites.in
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.PRODUCTION_MOBILE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_MOBILE_PROJECT }}
        run: ./android/gradlew -p android clean assembleRelease bundleRelease
      - name: Produce native exports and enforce bundle budgets
        env:
          EXPO_PUBLIC_APP_ENVIRONMENT: production
          EXPO_PUBLIC_RELEASE_CHANNEL: production
          EXPO_PUBLIC_RELEASE_ID: ${{ github.sha }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          EXPO_PUBLIC_WEB_BASE_URL: https://www.circlebites.in
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.PRODUCTION_MOBILE_SENTRY_DSN }}
        run: |
          npx expo export --platform android --output-dir dist-mobile-performance/android --source-maps
          npx expo export --platform ios --output-dir dist-mobile-performance/ios --source-maps
          npm --prefix .. run report:mobile-bundle
      - name: Verify signatures, merged release manifest, maps and secrets
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          # Android upload-key certificates are normally self-signed. Verify the
          # archive signature itself; Play App Signing owns production trust.
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/android-release-manifest.xml"
          grep -q 'package="com.circlebites.mobile"' "$RUNNER_TEMP/android-release-manifest.xml"
          grep -q 'android:allowBackup="false"' "$RUNNER_TEMP/android-release-manifest.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$RUNNER_TEMP/android-release-manifest.xml"
          if grep -Eq 'android:debuggable="true"|SYSTEM_ALERT_WINDOW|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|USE_BIOMETRIC|USE_FINGERPRINT|requestLegacyExternalStorage' "$RUNNER_TEMP/android-release-manifest.xml"; then exit 1; fi
          test -s android/app/build/outputs/mapping/release/mapping.txt
          test -s android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          test -n "$(find dist-mobile-performance -name '*.hbc.map' -print -quit)"
          node ../scripts/scan-release-artifact.mjs android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab $(find dist-mobile-performance -type f \( -name '*.hbc' -o -name '*.hbc.map' \))
          shasum -a 256 android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/mapping/release/mapping.txt android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip > "$RUNNER_TEMP/android-release-sha256.txt"
      - name: Retain signed artifacts and symbols
        uses: actions/upload-artifact@v4
        with:
          name: circlebites-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/mapping/release/mapping.txt
            mobile/android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
            mobile/dist-mobile-performance
            ${{ runner.temp }}/android-release-manifest.xml
            ${{ runner.temp }}/android-release-sha256.txt

  ios-release:
    name: Signed iOS IPA
    needs: [preflight, application-and-database]
    runs-on: macos-15
    timeout-minutes: 90
    environment: production-release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci && npm install --global eas-cli@20.1.0
      - name: Build a signed local EAS production IPA
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-ios-work
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENVIRONMENT: production
          EXPO_PUBLIC_RELEASE_CHANNEL: production
          EXPO_PUBLIC_RELEASE_ID: ${{ github.sha }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          EXPO_PUBLIC_WEB_BASE_URL: https://www.circlebites.in
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.PRODUCTION_MOBILE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_MOBILE_PROJECT }}
        run: eas build --local --non-interactive --platform ios --profile production --output "$RUNNER_TEMP/CircleBites.ipa"
      - name: Inspect and scan signed IPA, entitlements, privacy and symbols
        run: |
          unzip -q "$RUNNER_TEMP/CircleBites.ipa" -d "$RUNNER_TEMP/ipa-inspect"
          APP_PATH=$(find "$RUNNER_TEMP/ipa-inspect/Payload" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "com.circlebites.mobile"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0.0"
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/ios-entitlements.plist"
          grep -q '<string>production</string>' "$RUNNER_TEMP/ios-entitlements.plist"
          test -n "$(find "$APP_PATH" -name 'PrivacyInfo.xcprivacy' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/eas-ios-work" -name '*.dSYM' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/eas-ios-work" -name '*.map' -print -quit)"
          node ../scripts/scan-release-artifact.mjs "$RUNNER_TEMP/CircleBites.ipa" $(find "$RUNNER_TEMP/eas-ios-work" -name '*.map')
          shasum -a 256 "$RUNNER_TEMP/CircleBites.ipa" > "$RUNNER_TEMP/ios-release-sha256.txt"
      - name: Retain signed IPA, hashes and local build symbols
        uses: actions/upload-artifact@v4
        with:
          name: circlebites-ios-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/CircleBites.ipa
            ${{ runner.temp }}/ios-entitlements.plist
            ${{ runner.temp }}/ios-release-sha256.txt
            ${{ runner.temp }}/eas-ios-work/**/*.dSYM
            ${{ runner.temp }}/eas-ios-work/**/*.map

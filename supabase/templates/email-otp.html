<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Witoh verification code</title>
  </head>
  <body style="margin:0;background:#17130f;color:#fff7ed;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#17130f;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#231c16;border:1px solid #3a2e24;border-radius:18px;padding:32px;">
            <tr>
              <td style="font-size:28px;font-weight:700;text-align:center;">Circle<span style="color:#f97316;">Bites</span></td>
            </tr>
            <tr>
              <td style="padding-top:28px;font-size:16px;line-height:24px;text-align:center;">Use this verification code to continue:</td>
            </tr>
            <tr>
              <td style="padding:22px 0;font-size:36px;font-weight:700;letter-spacing:10px;text-align:center;color:#f97316;">{{ .Token }}</td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:20px;text-align:center;color:#b9aa9d;">This code expires in 10 minutes. If you did not request it, you can ignore this email.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
